spring.application.name=comm

# Database Configuration (Production)
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}  # Ensure correct format
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Properties (Production)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update  # Change to "none" if schema is pre-created
spring.jpa.show-sql=false  # Hide SQL logs in production

# Security & JWT (From Environment Variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Server Port (Render automatically assigns one, so no need to specify)
server.port=8000

# CORS (Allow only frontend URL)
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Stripe (Production API Keys from Environment Variables)
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Logging (Production - Keep logs minimal)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO


# Admin Configuration (From Environment Variables)
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.firstName=${ADMIN_FIRSTNAME}
admin.lastName=${ADMIN_LASTNAME}
admin.phoneNumber=${ADMIN_PHONE}
admin.key=${ADMIN_KEY}

# Swagger UI (Disable in production if not needed)
springdoc.swagger-ui.enabled=false

# Application settings
app.currency=USD
