spring.application.name=comm

# Server Port (Render automatically assigns one, so no need to specify)

# Database Configuration (From Render Environment Variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate Properties (Production)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none  # Prevents accidental schema changes
spring.jpa.show-sql=false  # Hide SQL logs in production

# Security & JWT (From Environment Variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Swagger UI (Can be disabled in production)
springdoc.swagger-ui.path=/swagger-ui.html

# Admin Configuration (From Environment Variables)
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.firstName=${ADMIN_FIRSTNAME}
admin.lastName=${ADMIN_LASTNAME}
admin.phoneNumber=${ADMIN_PHONE}
admin.key=${ADMIN_KEY}

# CORS (Allow only the frontend URL)
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Stripe (Production API Keys from Environment Variables)
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Logging (Production - Keep logs minimal)
logging.level.org.springframework.security=INFO
